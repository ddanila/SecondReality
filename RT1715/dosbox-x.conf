[sdl]
fullscreen = false
output = surface
autolock = false

[dosbox]
machine = vgaonly
memsize = 16
captures = capture

[cpu]
core = normal
cputype = 486
cycles = fixed 60000

[render]
aspect = true
scaler = normal2x

[sblaster]
sbtype = sbpro2
sbbase = 220
irq = 7
dma = 1

[gus]
gus = false

[midi]
mpu401 = none
mididevice = none

[dos]
xms = true
ems = true
umb = true

[autoexec]
@echo off
mount c build/dos
c:
set BLASTER=A220 I7 D1 T4
rt1715.exe
